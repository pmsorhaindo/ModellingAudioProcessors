<!DOCTYPE html>
<!-- Gyre #105 keyboard-focus spike page: a Drive knob, a button (Bypass), a text field, the focus-mode selector and
     diagnostics. Served from memory by the plugin (choc fetchResource). Also opens in a browser with a mock host. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gyre focus spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #121214; color: #d8d2c4;
               font: 13px -apple-system, "Helvetica Neue", sans-serif; user-select: none; -webkit-user-select: none;
               overflow: hidden; cursor: default; }
  main { display: grid; grid-template-columns: 180px 1fr; gap: 14px 22px; padding: 18px 22px; }
  h1 { grid-column: 1 / 3; margin: 0; font-size: 15px; letter-spacing: .08em; color: #c9a86a; font-weight: 600; }
  h1 small { color: #8a8478; font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .knob { width: 150px; height: 150px; touch-action: none; }
  .knob .val { font: 600 15px ui-monospace, Menlo, monospace; fill: #e8e0cc; }
  .knob .lbl { font-size: 11px; fill: #8a8478; letter-spacing: .12em; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #2a2a2e; color: #e8e0cc; border: 1px solid #45433d; border-radius: 4px; padding: 5px 10px;
           font: inherit; }
  button.on { background: #6b4f23; border-color: #c9a86a; }
  input[type=text] { width: 100%; padding: 6px 8px; background: #1c1c20; color: #f0ead8; border: 1px solid #45433d;
                     border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; user-select: text;
                     -webkit-user-select: text; }
  input[type=text]:focus { outline: 2px solid #c9a86a; }
  .diag { font: 11px ui-monospace, Menlo, monospace; color: #a8a090; white-space: pre; line-height: 1.45; }
  .diag b { color: #e8e0cc; font-weight: 600; }
  #log { height: 92px; overflow: hidden; border-top: 1px solid #2c2b28; padding-top: 4px; }
  .hint { font-size: 11px; color: #8a8478; max-width: 560px; }
</style>
</head>
<body>
<main>
  <h1>GYRE · key-focus spike <small id="fmt"></small></h1>

  <div class="col">
    <svg class="knob" id="knob" viewBox="0 0 150 150" aria-label="Drive">
      <circle cx="75" cy="70" r="50" fill="#1e1e22" stroke="#3a3832" stroke-width="2"/>
      <path id="arc" fill="none" stroke="#c9a86a" stroke-width="4" stroke-linecap="round"/>
      <line id="ptr" x1="75" y1="70" x2="75" y2="30" stroke="#e8e0cc" stroke-width="3" stroke-linecap="round"/>
      <text class="val" id="kval" x="75" y="76" text-anchor="middle">—</text>
      <text class="lbl" x="75" y="140" text-anchor="middle">DRIVE</text>
    </svg>
    <div class="row"><button id="bypass" tabindex="-1">Bypass</button></div>
  </div>

  <div class="col">
    <label class="hint">Text field (typing, Cmd C / V / X / A, arrows; Esc or click elsewhere hands keys back):</label>
    <input type="text" id="notes" placeholder="type here" spellcheck="false" autocomplete="off">
    <div class="row">
      <span class="hint">Focus mode:</span>
      <button data-mode="0" tabindex="-1">0 stock</button>
      <button data-mode="1" tabindex="-1">1 forward (a)</button>
      <button data-mode="2" tabindex="-1">2 + non-activating (b)</button>
      <button data-mode="3" tabindex="-1">3 + text-focus only (c)</button>
    </div>
    <div class="row">
      <span class="hint">Size:</span>
      <button data-size="0.75" tabindex="-1">75 %</button>
      <button data-size="1" tabindex="-1">100 %</button>
      <button data-size="1.5" tabindex="-1">150 %</button>
      <button data-size="2" tabindex="-1">200 %</button>
    </div>
    <div class="diag" id="diag"></div>
    <div class="diag" id="log"></div>
  </div>
</main>
<script>
"use strict";
// ---- host bridge (choc bind) or a browser mock -----------------------------------------------------------------
const host = (typeof window.gyre_set === "function") ? {
  begin: id => gyre_begin(id), set: (id, v) => gyre_set(id, v), end: id => gyre_end(id),
  ready: () => gyre_ready(), textFocus: f => gyre_textFocus(f ? 1 : 0), focusMode: m => gyre_focusMode(m),
  resize: (w, h) => gyre_resize(w, h),
} : {
  begin() {}, set(id, v) { setTimeout(() => gyre.onHost({ p: [[id, v]] }), 0); }, end() {},
  ready() { setTimeout(() => gyre.onHost({ p: [[0, 0.125], [4, 0]], keys: { forwarded: 0, mode: 3, text: false } }), 0); },
  textFocus() {}, focusMode(m) { gyre.onHost({ keys: { forwarded: 0, mode: m, text: false } }); },
  resize: async () => false,
};
document.getElementById("fmt").textContent = window.gyreHostFormat ? window.gyreHostFormat : "browser mock";

const BASE_W = 760, BASE_H = 400;
const DRIVE = 0, BYPASS = 4, DRIVE_MAX = 8;
const state = { norm: {}, dragging: -1, keys: { forwarded: 0, mode: -1, text: false }, pageKeys: 0 };
const logLines = [];
function log(s) { logLines.push(s); while (logLines.length > 6) logLines.shift(); document.getElementById("log").textContent = logLines.join("\n"); }

// ---- knob ------------------------------------------------------------------------------------------------------
const knob = document.getElementById("knob");
const A0 = -135, A1 = 135;
function polar(a, r) { const t = (a - 90) * Math.PI / 180; return [75 + r * Math.cos(t), 70 + r * Math.sin(t)]; }
function drawKnob(n) {
  const a = A0 + (A1 - A0) * n;
  const [x, y] = polar(a, 40);
  const ptr = document.getElementById("ptr"); ptr.setAttribute("x2", x); ptr.setAttribute("y2", y);
  const [sx, sy] = polar(A0, 58), [ex, ey] = polar(a, 58);
  document.getElementById("arc").setAttribute("d", n <= 0 ? "" :
    `M${sx},${sy} A58,58 0 ${a - A0 > 180 ? 1 : 0} 1 ${ex},${ey}`);
  document.getElementById("kval").textContent = (n * DRIVE_MAX).toFixed(2) + "×";
}
let dragY = 0, dragN = 0;
knob.addEventListener("pointerdown", e => {
  e.preventDefault();
  knob.setPointerCapture(e.pointerId);
  state.dragging = DRIVE; dragY = e.clientY; dragN = state.norm[DRIVE] ?? 0;
  host.begin(DRIVE);
});
knob.addEventListener("pointermove", e => {
  if (state.dragging !== DRIVE) return;
  const n = Math.min(1, Math.max(0, dragN + (dragY - e.clientY) / (e.shiftKey ? 800 : 200)));
  state.norm[DRIVE] = n; drawKnob(n); host.set(DRIVE, n);
});
function endDrag() { if (state.dragging === DRIVE) { state.dragging = -1; host.end(DRIVE); } }
knob.addEventListener("pointerup", endDrag);
knob.addEventListener("pointercancel", endDrag);
knob.addEventListener("dblclick", () => {
  const n = 1 / DRIVE_MAX; host.begin(DRIVE); host.set(DRIVE, n); host.end(DRIVE); state.norm[DRIVE] = n; drawKnob(n);
});
knob.addEventListener("wheel", e => {
  e.preventDefault();
  const n = Math.min(1, Math.max(0, (state.norm[DRIVE] ?? 0) - e.deltaY / 2000));
  host.begin(DRIVE); host.set(DRIVE, n); host.end(DRIVE); state.norm[DRIVE] = n; drawKnob(n);
}, { passive: false });

// ---- buttons: never take DOM focus, so the space bar cannot "press" them -----------------------------------------
for (const b of document.querySelectorAll("button")) b.addEventListener("mousedown", e => e.preventDefault());
const bypassBtn = document.getElementById("bypass");
bypassBtn.addEventListener("click", () => {
  const n = (state.norm[BYPASS] ?? 0) >= 0.5 ? 0 : 1;
  host.begin(BYPASS); host.set(BYPASS, n); host.end(BYPASS); state.norm[BYPASS] = n; drawBypass();
});
function drawBypass() { bypassBtn.classList.toggle("on", (state.norm[BYPASS] ?? 0) >= 0.5); }
for (const b of document.querySelectorAll("[data-mode]")) b.addEventListener("click", () => host.focusMode(+b.dataset.mode));
for (const b of document.querySelectorAll("[data-size]"))
  b.addEventListener("click", async () => {
    const s = +b.dataset.size;
    const ok = await host.resize(Math.round(BASE_W * s), Math.round(BASE_H * s));
    log(`resize ${s * 100} % -> ${ok ? "accepted" : "refused"}`);
  });

// ---- text focus: tell the host, so it gives the page key focus only while a text input has it --------------------
const isText = el => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type === "text") || el.isContentEditable);
document.addEventListener("pointerdown", e => {
  if (isText(e.target)) { host.textFocus(true); setTimeout(() => e.target.focus(), 0); }
  else if (isText(document.activeElement)) document.activeElement.blur();
}, true);
document.addEventListener("focusin", e => { if (isText(e.target)) host.textFocus(true); });
document.addEventListener("focusout", e => { if (isText(e.target) && !isText(e.relatedTarget)) host.textFocus(false); });
document.getElementById("notes").addEventListener("keydown", e => { if (e.key === "Escape") e.target.blur(); });

// keys the page itself receives (with modes 1-3 it should see none unless the text field has focus)
document.addEventListener("keydown", e => { state.pageKeys++; log(`page keydown "${e.key}" (target ${e.target.tagName.toLowerCase()})`); diag(); });

// ---- host -> page ------------------------------------------------------------------------------------------------
window.gyre = {
  onHost(msg) {
    if (msg.p) for (const [id, n] of msg.p) {
      if (id === state.dragging) continue;      // the drag owns the value; the echo would fight it
      state.norm[id] = n;
      if (id === DRIVE) drawKnob(n);
      if (id === BYPASS) drawBypass();
    }
    if (msg.keys) state.keys = msg.keys;
    diag();
  },
  blurText() { if (isText(document.activeElement)) document.activeElement.blur(); },
};
function diag() {
  for (const b of document.querySelectorAll("[data-mode]")) b.classList.toggle("on", +b.dataset.mode === state.keys.mode);
  document.getElementById("diag").innerHTML =
    `keys forwarded to host: <b>${state.keys.forwarded}</b>   page text focus (host view): <b>${state.keys.text}</b>\n` +
    `keys seen by the page:  <b>${state.pageKeys}</b>   document.hasFocus(): <b>${document.hasFocus()}</b>\n` +
    `window ${innerWidth}×${innerHeight} pt   devicePixelRatio <b>${devicePixelRatio}</b>`;
}
addEventListener("resize", diag);
drawKnob(0); drawBypass(); diag();
host.ready();
</script>
</body>
</html>
