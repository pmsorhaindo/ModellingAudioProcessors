name: bench 6AS6 (x86-64)

# The 6AS6 core's CPU benchmark (#104) on GitHub's x86-64 Linux runner, with the #20 harness (cpp/bench.py --core 6as6,
# cpp/bench_6as6.cpp; method in cpp/BENCHMARK.md). Informational, not a gate: a shared VM with no pinning, whose clock is
# not exposed, and whose hardware counters are usually unavailable (the results file then says null). It runs when the
# core or the harness changes, and on manual dispatch; the results file is uploaded as an artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - prototypes/fullstage/cpp/dk6as6_core.h
      - prototypes/fullstage/cpp/dk6as6_stereo.h
      - prototypes/fullstage/cpp/dk_core.h
      - prototypes/fullstage/cpp/bench_6as6.cpp
      - prototypes/fullstage/cpp/bench_common.h
      - prototypes/fullstage/cpp/bench.py
      - .github/workflows/bench-6as6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (6as6, x86-64 linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the paired control below builds the base (main) too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # bench.py needs the standard library only. 5 timed passes of 1 s (the #20 record uses 11 x 2 s), so the job
      # stays well inside its timeout on a 4-core runner; the record says so (meta.reps, meta.seconds_per_pass).
      - name: Benchmark (one core, x86-64 baseline build -O3)
        run: python -m cpp.bench --core 6as6 --reps 5 --seconds 1 --out bench_6as6_x86_64_linux_ci.json
      - name: Tables
        run: python -m cpp.bench --table bench_6as6_x86_64_linux_ci.json >> "$GITHUB_STEP_SUMMARY"
      # #135 review: a paired control on this same runner, the default setting at block 64: the base (git merge-base with
      # main); this head's core with the base's harness (cpp/bench_6as6.cpp of the base: the libm rows, #104's law and
      # solvers on both sides); this head (the Jacobian at every accepted trial, as solver.py) and this head with
      # -DDK6AS6_LAZY_JACOBIAN (the lazier Jacobian's research build; the fast rows *_fast differ); the base again.
      # bench.py --pair prints each / the base where the base has the row.
      - name: Paired control (base / head core / head eager / head / base)
        run: |
          base=$(git merge-base HEAD origin/main)
          git worktree add "$RUNNER_TEMP/base" "$base"
          mixed="$RUNNER_TEMP/mixed/prototypes/fullstage"
          mkdir -p "$mixed"
          cp -r cpp dk "$mixed/"
          cp "$RUNNER_TEMP/base/prototypes/fullstage/cpp/bench_6as6.cpp" "$mixed/cpp/bench_6as6.cpp"
          only="P1_0.45mA_0.5V_b64_x,P1_0.45mA_2V_b64_x,P1_0.45mA_8V_b64_x"
          args="--core 6as6 --reps 5 --seconds 1 --only $only"
          here="$PWD"
          (cd "$RUNNER_TEMP/base/prototypes/fullstage" && python -m cpp.bench $args --out "$here/pair_base_a.json")
          (cd "$mixed" && python -m cpp.bench $args --label "head core, base harness" --out "$here/pair_mixed.json")
          python -m cpp.bench $args --label "head (eager J)" --out pair_head.json
          python -m cpp.bench $args --flags "-O3 -DDK6AS6_LAZY_JACOBIAN" --label "head, lazy J" --out pair_lazy.json
          (cd "$RUNNER_TEMP/base/prototypes/fullstage" && python -m cpp.bench $args --out "$here/pair_base_b.json")
          python -m cpp.bench --pair pair_base_a.json pair_mixed.json pair_head.json pair_lazy.json pair_base_b.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-6as6-x86-64-linux
          path: |
            prototypes/fullstage/bench_6as6_x86_64_linux_ci.json
            prototypes/fullstage/pair_base_a.json
            prototypes/fullstage/pair_lazy.json
            prototypes/fullstage/pair_mixed.json
            prototypes/fullstage/pair_head.json
            prototypes/fullstage/pair_base_b.json
