name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  MPLBACKEND: Agg

jobs:
  test:
    name: test (${{ matrix.prototype }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        prototype: [valvelab, fullstage, fit6as6]
    defaults:
      run:
        working-directory: prototypes/${{ matrix.prototype }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/${{ matrix.prototype }}/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      # fit.py writes figures into plots/, which is gitignored.
      - name: Prepare output dirs
        if: matrix.prototype == 'fit6as6'
        run: mkdir -p plots
      # The DK tests compare against committed ngspice reference JSONs
      # (spice/reference_*.json), so ngspice itself is not needed here.
      - name: Pytest
        run: python -m pytest -q

  # Blocking aliasing guard (#35): the lean aliasing subset for every setting x filter at 2 V and 8 V, against
  # the absolute limits (dk/aliasing.py LIMIT_DBC) and the committed baseline ratchet (dk/aliasing_baseline.json,
  # 1.5 dB tolerance). To change the baseline on purpose: python -m dk.aliasing_guard --update-baseline --reason "..."
  aliasing:
    name: aliasing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/fullstage/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Aliasing guard (limits + baseline ratchet)
        run: python -m dk.aliasing_guard --workers "$(nproc)" --json aliasing_guard_results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasing-guard-results
          path: prototypes/fullstage/aliasing_guard_results.json
          if-no-files-found: warn

  lint:
    name: ruff (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff==0.17.3
      - name: Ruff (pyflakes + pycodestyle)
        run: ruff check --isolated --select E,F --output-format github prototypes
