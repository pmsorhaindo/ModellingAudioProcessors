name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, issue-140-ci-release-artifacts]
  workflow_dispatch:

concurrency:
  group: ci-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  MPLBACKEND: Agg

jobs:
  test:
    name: test (${{ matrix.prototype }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # wdf (#12): the WDF stage reuses prototypes/fullstage (its requirements.txt includes fullstage's); Linux only.
        # fullstage runs as shards: everything but the 6AS6 tests (#111), and the 6AS6 tests (dk6as6/, spice6as6/) in
        # four (#112, PR #128 review, #127): the stage tests with half the live validations, the other half, the live
        # envelope re-checks, and the rest. The single 6AS6 shard had reached 13-19 of 20 min with #112's grid-current
        # cases (and runs of one head varied 7.5-13.6 min). The macOS job below uses the same split.
        include:
          - prototype: valvelab
          - prototype: fullstage
            pytest_args: --ignore=dk6as6 --ignore=spice6as6 --ignore=cpp/tests/test_cpp_core_6as6.py
          # #104: the C++ 6AS6 core against the Python stage (vectors, bit-exact law and solvers, the ngspice
          # validation reproduced at standard and hq) in its own shard
          - prototype: fullstage
            shard: cpp 6as6
            pytest_args: cpp/tests/test_cpp_core_6as6.py
          - prototype: fullstage
            shard: 6as6 stage
            pytest_args: dk6as6/tests/test_dk6as6_stage.py
          - prototype: fullstage
            shard: 6as6 validation
            pytest_args: dk6as6/tests/test_dk6as6_validation.py
          - prototype: fullstage
            shard: 6as6 envelope
            pytest_args: dk6as6/tests/test_dk6as6_envelope.py
          - prototype: fullstage
            shard: 6as6 rest
            pytest_args: dk6as6 spice6as6 --ignore=dk6as6/tests/test_dk6as6_stage.py --ignore=dk6as6/tests/test_dk6as6_validation.py --ignore=dk6as6/tests/test_dk6as6_envelope.py
          - prototype: fit6as6
          - prototype: wdf
    defaults:
      run:
        working-directory: prototypes/${{ matrix.prototype }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/${{ matrix.prototype }}/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      # fit.py writes figures into plots/, which is gitignored.
      - name: Prepare output dirs
        if: matrix.prototype == 'fit6as6'
        run: mkdir -p plots
      # The DK and WDF tests compare against committed ngspice reference JSONs
      # (spice/reference_*.json), so ngspice itself is not needed here.
      - name: Pytest
        run: python -m pytest -q ${{ matrix.pytest_args }}

  # Apple silicon (#72): the plugin's first target (AU is macOS-only). The same fullstage suite as above, on an
  # arm64 macOS runner (Apple clang, numpy on Accelerate). Blocking since #70 was fixed.
  test-macos:
    name: test (fullstage${{ matrix.shard && format(' {0}', matrix.shard) || '' }}, macos arm64)
    # macOS minutes bill at 10x on private repos: run only on non-draft PRs and manual
    # dispatch, not on pushes to main or draft PRs. ready_for_review is in the workflow
    # types so marking a draft ready starts these jobs.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: macos-15
    # 30, not 20 (PR #151): the 6as6 envelope shard was cancelled at the 20 min cap (20m21s, run 45386062646) with
    # its tests unchanged from main. The same shard takes ~11.5 min on Linux (main after #131a, and that run) and
    # 6-7 min on earlier ready-PR macOS runs (#139, #133), so macOS runner time varies by ~3x. 30 min is above 2x the
    # Linux envelope time and above the 20m21s that was hit; it also gives the validation shard (12m37s) headroom.
    timeout-minutes: 30
    # Sharded as the Linux fullstage job (#127: the single job had reached 14.4 of 20 min); no test is dropped.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pytest_args: --ignore=dk6as6 --ignore=spice6as6 --ignore=cpp/tests/test_cpp_core_6as6.py
          - shard: cpp 6as6
            pytest_args: cpp/tests/test_cpp_core_6as6.py
          - shard: 6as6 stage
            pytest_args: dk6as6/tests/test_dk6as6_stage.py
          - shard: 6as6 validation
            pytest_args: dk6as6/tests/test_dk6as6_validation.py
          - shard: 6as6 envelope
            pytest_args: dk6as6/tests/test_dk6as6_envelope.py
          - shard: 6as6 rest
            pytest_args: dk6as6 spice6as6 --ignore=dk6as6/tests/test_dk6as6_stage.py --ignore=dk6as6/tests/test_dk6as6_validation.py --ignore=dk6as6/tests/test_dk6as6_envelope.py
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/fullstage/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q ${{ matrix.pytest_args }}

  # Validate the universal AU and VST 3 bundles on main, ready PRs and manual dispatch (#140).
  plugin-macos:
    name: plugin (AU + VST3, macos arm64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: >-
          cmake --build plugin/build -j "$(sysctl -n hw.ncpu)"
          --target map_vst3 map_au validator map_engine_test map_smoothing_test map_null_vst3 map_null_au
      - name: Download pluginval v1.0.4
        run: |
          mkdir -p "$RUNNER_TEMP/pluginval"
          cd "$RUNNER_TEMP/pluginval"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip \
            --output pluginval_macOS.zip
          shasum -a 256 -c <<'EOF'
          3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval_macOS.zip
          EOF
          ditto -x -k pluginval_macOS.zip .
      - name: Checks (engine, Steinberg validator, nulls, auval, pluginval strictness 10)
        env:
          PLUGINVAL: ${{ runner.temp }}/pluginval/pluginval.app/Contents/MacOS/pluginval
        run: plugin/tests/run_checks.sh plugin/build --au
      # Archive first so GitHub's artifact ZIP preserves the bundle executables' modes inside the tarball.
      # Manual runs make the validated test builds available for seven days.
      - name: Archive validated bundles with licenses
        if: github.event_name == 'workflow_dispatch'
        run: |
          notices="$RUNNER_TEMP/gyre-notices"
          mkdir -p "$notices/licenses"
          cp plugin/build/_deps/vst3sdk-src/LICENSE.txt "$notices/licenses/VST3-SDK.txt"
          cp plugin/build/_deps/audiounitsdk-src/LICENSE.txt "$notices/licenses/AudioUnitSDK.txt"
          cp LICENSE THIRD_PARTY_NOTICES.md "$notices/"
          tar -czf "$RUNNER_TEMP/Gyre.vst3.tar.gz" -C plugin/build/VST3/Release Gyre.vst3 \
            -C "$notices" LICENSE THIRD_PARTY_NOTICES.md licenses
          tar -czf "$RUNNER_TEMP/Gyre.component.tar.gz" -C plugin/build/AU Gyre.component \
            -C "$notices" LICENSE THIRD_PARTY_NOTICES.md licenses
      - name: Upload Gyre.vst3
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Gyre.vst3
          path: ${{ runner.temp }}/Gyre.vst3.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload Gyre.component
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Gyre.component
          path: ${{ runner.temp }}/Gyre.component.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # Blocking aliasing guard (#35): the lean aliasing subset for every setting x filter at 2 V and 8 V, against
  # the absolute limits (dk/aliasing.py LIMIT_DBC) and each tone's own committed baseline (separate rate files,
  # per-tone format version 2, unchanged 1.5 dB tolerance). To update intentionally:
  # python -m dk.aliasing_guard --update-baseline --reason "..."
  aliasing:
    name: aliasing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/fullstage/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Aliasing guard (limits + baseline ratchet)
        run: python -m dk.aliasing_guard --workers "$(nproc)" --json aliasing_guard_results.json
      # #96: 11 FIR points, verified against full/short 44.1 kHz sweeps. Separate baseline; retain 48 kHz above.
      - name: Aliasing guard at 44.1 kHz (FIR limits + baseline ratchet)
        if: success() || failure()
        run: python -m dk.aliasing_guard --fs 44100 --workers "$(nproc)" --json aliasing_guard_44100_results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasing-guard-results
          path: |
            prototypes/fullstage/aliasing_guard_results.json
            prototypes/fullstage/aliasing_guard_44100_results.json
          if-no-files-found: warn

  # Blocking 6AS6 aliasing guard (#113): the same method as `aliasing` on dk6as6.stage.Stage, a lean subset of the
  # full sweeps (dk6as6/aliasing_quality.json) against each key's limit (worst + 3 dB) and each tone's own committed
  # baseline (dk6as6/aliasing_baseline[_44100].json, format version 2, 1.5 dB tolerance). Its own job: the 6AS6 stage
  # is pure Python and slow, and the `test (fullstage 6as6)` shard has no room for it. To update intentionally:
  # python -m dk6as6.aliasing_guard [--fs 44100] --update-baseline --reason "..."
  aliasing-6as6:
    name: aliasing (6as6, ${{ matrix.fs }} Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job per host rate (#113 review): the subset grew with the band-edge tones; split, each rate stays well under
    # 60 % of its limit (#127's target).
    strategy:
      fail-fast: false
      matrix:
        fs: [48000, 44100]
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/fullstage/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: 6AS6 aliasing guard (limits + baseline ratchet)
        run: python -m dk6as6.aliasing_guard --fs ${{ matrix.fs }} --workers "$(nproc)" --json aliasing6as6_guard_${{ matrix.fs }}_results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasing-6as6-guard-results-${{ matrix.fs }}
          path: prototypes/fullstage/aliasing6as6_guard_${{ matrix.fs }}_results.json

  # The C++ 6AS6 core's aliasing guard (#104, #98 per-tone convention): every supported setting (P1 0.1-0.6 mA, T
  # 0.1-0.5 mA, grid current on) x standard / hq x 2 / 8 V at its full sweep's worst tone and 19037 Hz, full 1 s windows
  # after the 1.25 s settle, against the shipped 12AX7 stage's budget for the same quality and drive and each tone's
  # committed baseline (cpp/aliasing_6as6_baseline[_44100].json, 1.5 dB). One job per rate. To update intentionally:
  # python -m cpp.aliasing_6as6 guard --fs N --update-baseline --reason "..."
  aliasing-6as6-cpp:
    name: aliasing (6as6 C++ core, ${{ matrix.fs }} Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fs: [48000, 44100]
    defaults:
      run:
        working-directory: prototypes/fullstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: prototypes/fullstage/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: 6AS6 C++ aliasing guard (gate + per-tone baseline ratchet)
        run: python -m cpp.aliasing_6as6 guard --fs ${{ matrix.fs }} --workers "$(nproc)" --json aliasing_6as6_cpp_${{ matrix.fs }}.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasing-6as6-cpp-${{ matrix.fs }}
          path: prototypes/fullstage/aliasing_6as6_cpp_${{ matrix.fs }}.json
          if-no-files-found: warn

  # Blocking lint (#87). Settings (line length 120, select E and F) are in ruff.toml at the repo root, shared with
  # the pre-commit hook (.pre-commit-config.yaml); keep the ruff version here and the hook's rev the same.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff==0.17.3
      - name: Ruff (pyflakes + pycodestyle, settings from ruff.toml)
        run: ruff check --output-format github prototypes

  # Merge gate (#113 review). One stable check name for main's branch protection: .github/scripts/ci_gate.py reads every
  # job of this run from the API and fails unless each expected job (its list, by name, every matrix leg) is present and
  # passed (the fullstage macOS matrix may be skipped on drafts and main, and the plugin job on drafts), and no
  # unlisted job exists. The workflow cannot block a merge by itself: making
  # "ci gate" a required status check on main is a repository setting (Settings -> Branches / Rulesets).
  ci-gate:
    name: ci gate
    if: always()
    permissions:
      contents: read
      actions: read
    needs: [test, test-macos, plugin-macos, aliasing, aliasing-6as6, aliasing-6as6-cpp, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # Each job's own conclusion from the API (the needs context aggregates matrix legs; PR #129 re-review).
      - name: Every expected job passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULLSTAGE_MACOS_EXPECTED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
          PLUGIN_EXPECTED: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
        run: python3 .github/scripts/ci_gate.py
