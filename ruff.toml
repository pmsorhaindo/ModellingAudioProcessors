# Ruff settings for the whole repository (#87). The CI `ruff` job (`ruff check prototypes`) and the pre-commit hook
# (.pre-commit-config.yaml) both read this file. Ruff 0.17.3: pinned in .github/workflows/ci.yml and in the hook's rev.
# No per-file ignores: the few intentional exceptions are `# noqa: <code> -- <reason>` on the line itself.
line-length = 120

[lint]
select = ["E", "F"]   # pycodestyle errors and pyflakes
